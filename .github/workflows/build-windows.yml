name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HitOrStand.exe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the game
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install game and build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check dependencies
        run: python -m pip check

      - name: Build Windows executable with bundled assets
        working-directory: Game
        run: python -m PyInstaller --clean --noconfirm main.spec

      - name: Upload Windows download
        uses: actions/upload-artifact@v7
        with:
          name: HitOrStand-Windows
          path: Game/dist/HitOrStand.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
